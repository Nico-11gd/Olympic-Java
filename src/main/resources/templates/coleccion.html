<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección - Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-5" style="background:var(--ol-bg); min-height:100vh;">

    <h5 class="heading-ol text-uppercase mb-4">Nuestra Colección</h5>

    <!-- CATEGORÍAS / FILTROS -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/coleccion}" class="btn btn-sm rounded-pill fw-semibold"
           th:classappend="${categoriaSeleccionada == null} ? 'pill-ol-active' : 'pill-ol-inactive'">
            Todos
        </a>
        <a th:each="cat : ${categorias}"
           th:href="@{/coleccion(categoria=${cat.id})}"
           th:text="${cat.nombre}"
           class="btn btn-sm rounded-pill fw-semibold"
           th:classappend="${categoriaSeleccionada != null and categoriaSeleccionada == cat.id} ? 'pill-ol-active' : 'pill-ol-inactive'">
        </a>
    </div>

    <!-- BUSCADOR -->
    <form th:action="@{/coleccion}" method="get" id="catalogo" class="mb-4">
        <div class="input-group" style="max-width:500px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" name="q" th:value="${busqueda}" class="form-control" placeholder="Buscar productos...">
            <button type="submit" class="btn btn-ol-gold fw-semibold">Buscar</button>
        </div>
    </form>

    <!-- PRODUCTOS -->
    <h6 class="heading-ol text-uppercase mb-3">
        <span th:if="${busqueda != null and !busqueda.isEmpty()}" th:text="'Resultados para: ' + ${busqueda}"></span>
        <span th:unless="${busqueda != null and !busqueda.isEmpty()}">Productos Disponibles</span>
    </h6>

    <div th:if="${productos.isEmpty()}" class="text-center text-ol-muted py-5">
        <i class="bi bi-search fs-1 d-block mb-2"></i>
        No se encontraron productos.
    </div>

    <div class="row d-flex flex-wrap justify-content-center g-3 mb-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="p : ${productos}">
            <a th:href="@{/producto(id=${p.id})}" class="card h-100 border-0 rounded-4 overflow-hidden text-decoration-none d-block product-card-ol">
                <div class="ratio ratio-4x3 product-img-wrap position-relative">
                    <span th:if="${p.stock == 0}" class="sold-out-tag">Sold Out</span>
                    <img th:if="${p.imagenUrl != null}" th:src="@{${p.imagenUrl}}" class="w-100 h-100" style="object-fit:cover;" alt="">
                    <div th:unless="${p.imagenUrl != null}" class="d-flex align-items-center justify-content-center h-100">
                        <i class="bi bi-bag text-ol-muted fs-1"></i>
                    </div>
                </div>
                <div class="card-body p-2">
                    <p class="text-uppercase small text-ol-muted mb-1" style="font-size:.65rem;" th:text="${p.categoria ?: 'Sin categoría'}"></p>
                    <p class="product-name mb-1" th:text="${p.nombre}"></p>
                    <div class="mb-1">
                        <span th:if="${p.precioPromocion != null}">
                            <span class="product-price"
                                  th:text="'$' + ${#numbers.formatDecimal(p.precioPromocion, 0, 'COMMA', 0, 'POINT')}"></span>
                            <span class="text-ol-muted text-decoration-line-through small"
                                  th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                            <span class="badge bg-danger ms-1" th:text="'-' + ${p.descuentoPorcentaje} + '%'"></span>
                        </span>
                        <span th:unless="${p.precioPromocion != null}" class="product-price"
                              th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                    <span class="product-link" th:text="${p.stock == 0} ? 'Agotado' : 'Ver detalle'"></span>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer-ol p-4 mt-0">
    <div class="container-fluid px-3 px-md-4 px-lg-5">
        <div class="row align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:36px; width:auto; object-fit:contain;" class="mb-2">
                <p class="small mb-1" style="color:var(--ol-text-muted);">Tu tienda de moda con los mejores productos</p>
                <p class="small mb-1" style="color:var(--ol-text-muted);"><i class="bi bi-geo-alt me-1" style="color:var(--ol-gold);"></i>Bogotá, Colombia</p>
                <p class="small mb-1" style="color:var(--ol-text-muted);"><i class="bi bi-envelope me-1" style="color:var(--ol-gold);"></i>info@olympicstore.com</p>
                <p class="small mb-0" style="color:var(--ol-text-muted);"><i class="bi bi-telephone me-1" style="color:var(--ol-gold);"></i>+57 300 123 4567</p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="small mb-0" style="color:var(--ol-text-muted);">&copy; 2026 Olympic Store. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
