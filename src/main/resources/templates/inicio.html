<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLIMPIC — Tu tienda de moda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/tienda.css}" href="/css/tienda.css" />
    <link rel="stylesheet" th:href="@{/css/inicio.css}" href="/css/inicio.css" />
</head>
<body>

<div th:replace="~{fragments/iconos :: sprite}"></div>

<header class="navbar">
    <a class="nav-logo" href="/">OLIMPIC</a>
    <div class="nav-acciones">
        <button type="button" class="nav-icon-btn" id="nav-carrito-btn" aria-label="Carrito">
            <svg class="icon"><use href="#icon-cart"/></svg>
        </button>
        <a class="btn-catalogo" href="/login" id="nav-login" hidden><span>Iniciar sesión</span></a>
        <div class="nav-usuario" id="nav-usuario" hidden>
            <span class="nav-usuario-nombre" id="nav-usuario-nombre"></span>
            <button type="button" class="btn-catalogo" id="nav-logout"><span>Cerrar sesión</span></button>
        </div>
    </div>
</header>

<div class="container py-4">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div class="ini-buscador">
            <svg class="icon icon-muted"><use href="#icon-search"/></svg>
            <input type="text" id="ini-buscar" placeholder="Buscar productos..." autocomplete="off" />
        </div>
        <select class="ini-orden" id="ini-orden">
            <option value="recientes">Más recientes</option>
            <option value="precio_asc">Menor precio</option>
            <option value="precio_desc">Mayor precio</option>
            <option value="nombre">A → Z</option>
        </select>
    </div>

    <div class="ini-chips" id="ini-chips"></div>

    <div class="d-flex justify-content-between align-items-baseline mb-3">
        <h1 class="h4 fw-bold mb-0" id="ini-titulo">Todos los productos</h1>
        <p class="text-muted small mb-0" id="ini-conteo">0 productos</p>
    </div>

    <div class="text-center py-5" id="ini-cargando">
        <div class="spinner-border" style="color:var(--gold)" role="status"></div>
    </div>

    <div class="text-center py-5 text-muted" id="ini-vacio" hidden>
        <svg class="icon icon-xl icon-muted d-block mx-auto mb-2"><use href="#icon-shirt"/></svg>
        No se encontraron productos
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="ini-grid" hidden></div>
</div>

<template id="tpl-card">
    <div class="col">
        <a class="producto-card d-block h-100" href="#">
            <div class="producto-card-img position-relative">
                <img class="producto-img" alt="" hidden />
                <div class="producto-img img-placeholder d-flex align-items-center justify-content-center">
                    <svg class="icon icon-xl icon-muted"><use href="#icon-shirt"/></svg>
                </div>
                <span class="badge-descuento position-absolute" hidden></span>
            </div>
            <div class="p-2">
                <p class="nombre-producto mb-1"></p>
                <div>
                    <span class="precio"></span>
                    <span class="precio-anterior ms-1" hidden></span>
                </div>
            </div>
        </a>
    </div>
</template>

<footer class="ini-footer">
    <div class="container">
        <div class="row gy-4">
            <div class="col-md-4">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="logo-circulo">O</span>
                    <span class="fw-bold text-white">OLIMPIC</span>
                </div>
                <p class="small mb-0">Tu tienda de moda con los mejores productos.</p>
            </div>
            <div class="col-md-4">
                <h6 class="text-white">Tienda</h6>
                <ul class="list-unstyled small"><li><a href="/">Catálogo</a></li></ul>
            </div>
            <div class="col-md-4">
                <h6 class="text-white">Cuenta</h6>
                <ul class="list-unstyled small"><li><a href="/login">Iniciar sesión</a></li></ul>
            </div>
        </div>
        <hr class="border-secondary my-4">
        <p class="small text-center mb-0">© 2026 OLIMPIC STORE. Todos los derechos reservados.</p>
    </div>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/notificaciones.js}" src="/js/notificaciones.js"></script>
<script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
<script th:src="@{/js/api.js}" src="/js/api.js"></script>
<script th:src="@{/js/inicio.js}" src="/js/inicio.js"></script>
</body>
</html>
