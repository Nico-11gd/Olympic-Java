<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background:#F2E9D8;">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5">

    <!-- CATEGORÍAS -->
    <h6 class="fw-bold text-uppercase mt-3 mb-3 pb-2" style="color:#241E14; letter-spacing:1px; border-bottom:3px solid #D4AF37;">Categorías</h6>
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/}" class="btn btn-sm rounded-pill fw-semibold"
           th:style="${categoriaSeleccionada == null} ? 'background:#241E14; color:#FFFDF6;' : 'background:#FFFDF6; border:1.5px solid #D4AF37; color:#8A6D1A;'">
            Todos
        </a>
        <a th:each="cat : ${categorias}"
           th:href="@{/(categoria=${cat.id})}"
           th:text="${cat.nombre}"
           class="btn btn-sm rounded-pill fw-semibold"
           th:style="${categoriaSeleccionada != null and categoriaSeleccionada == cat.id} ? 'background:#241E14; color:#FFFDF6;' : 'background:#FFFDF6; border:1.5px solid #D4AF37; color:#8A6D1A;'">
        </a>
    </div>

    <!-- BUSCADOR -->
    <form th:action="@{/}" method="get" id="catalogo" class="mb-4">
        <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
            <input type="search" name="q" th:value="${busqueda}" class="form-control" placeholder="Buscar productos...">
            <button type="submit" class="btn fw-semibold" style="background:#241E14; color:#FFFDF6;">Buscar</button>
        </div>
    </form>

    <!-- PRODUCTOS -->
    <h6 class="fw-bold text-uppercase mb-3 pb-2" style="color:#241E14; letter-spacing:1px; border-bottom:3px solid #D4AF37;">
        <span th:if="${busqueda != null and !busqueda.isEmpty()}" th:text="'Resultados para: ' + ${busqueda}"></span>
        <span th:unless="${busqueda != null and !busqueda.isEmpty()}">Productos Destacados</span>
    </h6>

    <div th:if="${productos.isEmpty()}" class="text-center text-muted py-5">
        <i class="bi bi-search fs-1 d-block mb-2"></i>
        No se encontraron productos.
    </div>

    <div class="row d-flex flex-wrap justify-content-center g-3 mb-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="p : ${productos}">
            <a th:href="@{/producto(id=${p.id})}" class="card h-100 border-0 shadow-sm rounded-4 overflow-hidden text-decoration-none d-block">
                <div class="ratio ratio-4x3" style="background:#FFF4D9;">
                    <span th:if="${p.stock == 0}" class="badge bg-danger position-absolute m-2" style="z-index:2;">AGOTADO</span>
                    <img th:if="${p.imagenUrl != null}" th:src="@{${p.imagenUrl}}" class="w-100 h-100" style="object-fit:cover;" alt="">
                    <div th:unless="${p.imagenUrl != null}" class="d-flex align-items-center justify-content-center h-100">
                        <i class="bi bi-bag text-muted fs-1"></i>
                    </div>
                </div>
                <div class="card-body p-2">
                    <p class="text-uppercase small text-muted mb-1" style="font-size:.65rem;" th:text="${p.categoria ?: 'Sin categoría'}"></p>
                    <p class="fw-bold mb-1" style="color:#241E14; font-size:.85rem;" th:text="${p.nombre}"></p>
                    <div class="mb-1">
                        <span th:if="${p.precioPromocion != null}">
                            <span class="fw-bold" style="color:#D4AF37;"
                                  th:text="'$' + ${#numbers.formatDecimal(p.precioPromocion, 0, 'COMMA', 0, 'POINT')}"></span>
                            <span class="text-muted text-decoration-line-through small"
                                  th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                            <span class="badge bg-danger ms-1" th:text="'-' + ${p.descuentoPorcentaje} + '%'"></span>
                        </span>
                        <span th:unless="${p.precioPromocion != null}" class="fw-bold" style="color:#D4AF37;"
                              th:text="'$' + ${#numbers.formatDecimal(p.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                    </div>
                    <span class="small fw-semibold text-uppercase" th:style="${p.stock == 0} ? 'color:#999;' : 'color:#8A6D1A;'">
                        <i class="bi bi-box-arrow-up-right me-1"></i><span th:text="${p.stock == 0} ? 'Agotado' : 'Ver detalle'"></span>
                    </span>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="p-4 mt-4" style="background:#241E14;">
    <div class="container-fluid px-3 px-md-4 px-lg-5">
        <p class="fw-bold mb-2" style="color:#D4AF37; letter-spacing:3px;">OLIMPIC STORE</p>
        <p class="small mb-1" style="color:#ccc;">Tu tienda de moda con los mejores productos</p>
        <p class="small mb-1" style="color:#ccc;"><i class="bi bi-geo-alt"></i> Bogotá, Colombia</p>
        <p class="small mb-1" style="color:#ccc;"><i class="bi bi-envelope"></i> info@olimpicstore.com</p>
        <p class="small mb-3" style="color:#ccc;"><i class="bi bi-telephone"></i> +57 300 123 4567</p>
        <p class="small text-center mb-0" style="color:#777;">&copy; 2026 OLIMPIC STORE. Todos los derechos reservados.</p>
    </div>
</footer>

</body>
</html>
