<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ═══════ HERO (static, sin carrusel) ═══════ -->
<section class="hero-ol" id="hero">
    <video class="hero-video" autoplay muted loop playsinline preload="auto">
        <source th:src="@{/video/hero.mp4#t=8}" type="video/mp4">
    </video>
    <div class="hero-overlay"></div>
    <div class="hero-content d-flex flex-column align-items-center justify-content-center text-center px-3"
         style="min-height:100vh;">
        <img th:src="@{/marca/logo.png}" alt="Olympic Store"
             style="height:180px; width:auto; object-fit:contain; filter:drop-shadow(0 2px 10px rgba(0,0,0,.3));" class="mb-4">
        <a th:href="@{/coleccion}" class="btn btn-lg fw-bold px-5 rounded-pill btn-ol-gold"
           style="letter-spacing:1px; box-shadow:0 4px 20px rgba(212,175,55,.4);">
            <i class="bi bi-bag me-2"></i>VER COLECCIÓN
        </a>
    </div>
</section>

<!-- FOOTER -->
<footer class="footer-ol p-4 mt-0">
    <div class="container-fluid px-3 px-md-4 px-lg-5">
        <div class="row align-items-center">
            <div class="col-md-6 mb-3 mb-md-0">
                <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:36px; width:auto; object-fit:contain;" class="mb-2">
                <p class="small mb-1" style="color:var(--ol-text-muted);">Tu tienda de moda con los mejores productos</p>
                <p class="small mb-1" style="color:var(--ol-text-muted);"><i class="bi bi-geo-alt me-1" style="color:var(--ol-gold);"></i>Bogotá, Colombia</p>
                <p class="small mb-1" style="color:var(--ol-text-muted);"><i class="bi bi-envelope me-1" style="color:var(--ol-gold);"></i>info@olympicstore.com</p>
                <p class="small mb-0" style="color:var(--ol-text-muted);"><i class="bi bi-telephone me-1" style="color:var(--ol-gold);"></i>+57 300 123 4567</p>
            </div>
            <div class="col-md-6 text-md-end">
                <p class="small mb-0" style="color:var(--ol-text-muted);">&copy; 2026 Olympic Store. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
