<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis pagos — Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/admin-header :: admin-header(currentPage='pagosCliente')}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-4">

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
        <div>
            <span class="badge rounded-pill badge-ol-title mb-2">MIS PAGOS</span>
            <h1 class="fw-bold mb-0" style="color:var(--ol-white);">Pagos realizados</h1>
            <p class="mb-0 mt-1" style="color:var(--ol-text-muted);">Tu historial de pagos por método y estado, en un solo lugar.</p>
        </div>
        <a th:href="@{/admin}" class="btn btn-sm btn-ol-outline rounded-pill">
            <i class="bi bi-arrow-left me-1"></i>Volver al panel
        </a>
    </div>

    <!-- Resumen -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card card-ol p-3 text-center h-100">
                <span class="small text-uppercase" style="color:var(--ol-text-muted);">Pagos realizados</span>
                <span class="display-6 fw-bold" style="color:var(--ol-white);" th:text="${#lists.size(misPagos)}">0</span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-ol p-3 text-center h-100">
                <span class="small text-uppercase" style="color:var(--ol-text-muted);">Monto aprobado</span>
                <span class="display-6 fw-bold" style="color:var(--ol-success);">$<span th:text="${#numbers.formatInteger(montoAprobado, 0, 'COMMA')}">0</span></span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-ol p-3 text-center h-100">
                <span class="small text-uppercase" style="color:var(--ol-text-muted);">Aprobados</span>
                <span class="display-6 fw-bold" style="color:var(--ol-success);" th:text="${pagosAprobados}">0</span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-ol p-3 text-center h-100">
                <span class="small text-uppercase" style="color:var(--ol-text-muted);">Rechazados</span>
                <span class="display-6 fw-bold" style="color:var(--ol-danger);" th:text="${pagosRechazados}">0</span>
            </div>
        </div>
    </div>

    <!-- Listado -->
    <div class="card card-ol mb-4">
        <div class="card-header d-flex align-items-center justify-content-between gap-2">
            <span class="fw-bold" style="color:var(--ol-white);">
                <i class="bi bi-wallet2 me-2" style="color:var(--ol-gold);"></i>Mis pagos
            </span>
            <span class="badge rounded-pill badge-ol-role-cliente" th:text="${#lists.size(misPagos)}"></span>
        </div>
        <div class="card-body p-3">
            <div th:if="${#lists.isEmpty(misPagos)}" class="text-center text-ol-muted py-4">
                <i class="bi bi-wallet2 fs-1 d-block mb-2"></i>Aún no has realizado pagos.
            </div>
            <div th:unless="${#lists.isEmpty(misPagos)}" class="table-responsive">
                <table class="table table-sm table-ol align-middle mb-0">
                    <thead>
                    <tr class="small text-uppercase" style="color:var(--ol-text-muted);">
                        <th>#</th>
                        <th>Fecha</th>
                        <th>Pedido</th>
                        <th>Método</th>
                        <th>Estado</th>
                        <th class="text-end">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pg : ${misPagos}">
                        <td class="fw-semibold" style="color:var(--ol-white);" th:text="'#' + ${pg.id}"></td>
                        <td class="small" style="color:var(--ol-text-muted);" th:text="${pg.createdAt != null ? #temporals.format(pg.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td th:text="${pg.pedidoId != null} ? '#' + ${pg.pedidoId} : '-'"></td>
                        <td class="small" style="color:var(--ol-text);" th:text="${pg.metodo != null} ? ${#strings.capitalize(pg.metodo.valor)} : '-'"></td>
                        <td>
                            <span th:if="${pg.estado != null}" class="badge rounded-pill"
                                  th:classappend="${pg.estado.name() == 'APROBADO'} ? 'text-bg-success' : (${pg.estado.name() == 'PENDIENTE'} ? 'text-bg-warning' : 'text-bg-danger')"
                                  th:text="${#strings.capitalize(pg.estado.valor)}"></span>
                            <span th:unless="${pg.estado != null}" class="badge rounded-pill text-bg-secondary">Pendiente</span>
                        </td>
                        <td class="text-end fw-semibold" style="color:var(--ol-gold);" th:text="'$' + ${#numbers.formatDecimal(pg.total, 0, 'COMMA', 0, 'POINT')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

</body>
</html>
