<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olympic Store — Panel del Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/admin-header :: admin-header(currentPage='inicio')}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-4">

    <div th:if="${cliente != null}">
        <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-4">
            <div>
                <span class="badge rounded-pill badge-ol-title mb-2">PANEL DEL CLIENTE</span>
                <h1 class="fw-bold mb-0" style="color:var(--ol-white);">
                    Hola, <span th:text="${cliente.nombre}"></span>
                </h1>
                <p class="mb-0 mt-1" style="color:var(--ol-text-muted);">El resumen de tu cuenta en Olympic Store.</p>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-bag-check fs-3" style="color:var(--ol-gold);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${#lists.size(misPedidos)}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Compras</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-cash-stack fs-3" style="color:var(--ol-success);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white); text-overflow:ellipsis; overflow:hidden;">$<span th:text="${#numbers.formatInteger(totalInvertido, 0, 'COMMA')}">0</span></span>
                    <span class="small" style="color:var(--ol-text-muted);">Invertido</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-wallet2 fs-3" style="color:var(--ol-info);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${#lists.size(misPagos)}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Pagos realizados</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-clock-history fs-3" style="color:var(--ol-warning);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-warning);" th:text="${pagosPendientes}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Pagos pendientes</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-truck fs-3" style="color:var(--ol-info);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${pedidosEnProceso}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">En proceso</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-check2-circle fs-3" style="color:var(--ol-success);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${pedidosEntregados}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Entregados</span>
                </div>
            </div>
        </div>

        <h6 class="heading-ol text-uppercase mb-3">Accesos rápidos</h6>
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/cliente/perfil}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-person-circle fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Mi perfil</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/cliente/compras}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-bag-check fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Mis compras</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/cliente/pagos}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-credit-card fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Mis pagos</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a href="#" class="card card-ol text-decoration-none p-4 text-center h-100" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil">
                    <i class="bi bi-person-gear fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Editar datos</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a href="#" class="card card-ol text-decoration-none p-4 text-center h-100" data-bs-toggle="modal" data-bs-target="#modalFotoPerfilAdmin">
                    <i class="bi bi-camera fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Cambiar foto</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-shop fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Ir a la tienda</span>
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
