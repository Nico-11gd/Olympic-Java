<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código - Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>
<div class="container-fluid px-3 px-md-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-ol shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:50px; width:auto; object-fit:contain;" class="mb-3">
                    <h3 class="fw-bold mb-2" style="color:var(--ol-white);">Verifica el código</h3>
                    <p class="small mb-4" style="color:var(--ol-text-muted);">Revisa tu correo <strong th:text="${correo}" style="color:var(--ol-gold);"></strong> e ingresa el código junto con tu nueva contraseña.</p>

                    <div th:if="${mensaje}" class="alert alert-success p-2 fs-6" th:text="${mensaje}"></div>
                    <div th:if="${error}" class="alert alert-danger p-2 fs-6" th:text="${error}"></div>

                    <form th:action="@{/recuperar-password/codigo}" method="post" class="needs-validation" novalidate>
                        <input type="hidden" name="correo" th:value="${correo}">

                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold">Código de verificación <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="text" name="codigo" class="form-control" maxlength="6" minlength="6" required autofocus placeholder="Ej: 123456">
                            </div>
                            <div class="invalid-feedback">El código debe tener exactamente 6 caracteres.</div>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold">Nueva contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="nuevaPassword" class="form-control" required minlength="6" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+" placeholder="Mínimo 6 caracteres">
                            </div>
                            <div class="invalid-feedback">Mínimo 6 caracteres, una mayúscula, una minúscula, un número y un símbolo.</div>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label fw-semibold">Confirmar contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="confirmarPassword" class="form-control" required minlength="6" placeholder="Repite la contraseña">
                            </div>
                            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                        </div>

                        <button type="submit" class="btn w-100 fw-semibold py-2 rounded-pill btn-ol-gold">
                            <i class="bi bi-shield-check me-1"></i> Cambiar contraseña
                        </button>
                    </form>

                    <p class="mt-4 mb-0">
                        <a th:href="@{/login}" class="small" style="color:var(--ol-text-muted);">&larr; Volver al inicio de sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
