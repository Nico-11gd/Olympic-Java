<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - Panel Olympic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/admin-header :: admin-header(currentPage='pagos')}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-4">

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <h3 class="fw-bold mb-0" style="color:var(--ol-white);">Pagos</h3>

        <form th:action="@{/admin/pagos}" method="get" class="d-flex flex-wrap gap-2">
            <input type="hidden" name="estado" th:value="${estadoSeleccionado}">
            <input type="search" name="q" th:value="${busqueda}" class="form-control" style="min-width:160px; flex:1 1 160px;" placeholder="Buscar por pago, pedido o método...">
            <button type="submit" class="btn btn-ol-dark">
                <i class="bi bi-search"></i>
            </button>
            <a href="#modal-nuevo" class="btn fw-bold text-nowrap btn-ol-gold">
                <i class="bi bi-plus-lg"></i> Nuevo
            </a>
        </form>
    </div>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
        <div class="d-flex flex-wrap gap-2">
            <a th:href="@{/admin/pagos(estado='todos', q=${busqueda})}" class="btn btn-sm rounded-pill fw-semibold"
               th:classappend="${estadoSeleccionado == 'todos'} ? 'pill-ol-active' : 'pill-ol-inactive'">
                <i class="bi bi-grid"></i> Todos
            </a>
            <a th:href="@{/admin/pagos(estado='pendientes', q=${busqueda})}" class="btn btn-sm rounded-pill fw-semibold"
               th:classappend="${estadoSeleccionado == 'pendientes'} ? 'pill-ol-active' : 'pill-ol-inactive'">
                <i class="bi bi-hourglass-split"></i> Pendientes
            </a>
            <a th:href="@{/admin/pagos(estado='aprobados', q=${busqueda})}" class="btn btn-sm rounded-pill fw-semibold"
               th:classappend="${estadoSeleccionado == 'aprobados'} ? 'pill-ol-active' : 'pill-ol-inactive'">
                <i class="bi bi-check-circle"></i> Aprobados
            </a>
            <a th:href="@{/admin/pagos(estado='rechazados', q=${busqueda})}" class="btn btn-sm rounded-pill fw-semibold"
               th:classappend="${estadoSeleccionado == 'rechazados'} ? 'pill-ol-active' : 'pill-ol-inactive'">
                <i class="bi bi-x-circle"></i> Rechazados
            </a>
        </div>
        <span class="small text-ol-muted" th:text="${pagos.size()} + ' pago(s)'"></span>
    </div>

    <div th:if="${pagos.isEmpty()}" class="text-center text-ol-muted py-5">
        <i class="bi bi-credit-card fs-1 d-block mb-2"></i>No se encontraron pagos.
    </div>

    <!-- Desktop: table -->
    <div th:unless="${pagos.isEmpty()}" class="table-responsive rounded-4 d-none d-md-block table-ol">
        <table class="table align-middle mb-0">
            <thead>
            <tr class="small text-uppercase" style="color:var(--ol-text-muted);">
                <th>#</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Método</th>
                <th>Estado</th>
                <th>Total</th>
                <th>Fecha</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pagos}">
                <td class="fw-semibold" style="color:var(--ol-white);" th:text="'#' + ${p.id}"></td>
                <td>
                    <span class="badge rounded-pill" style="background:var(--ol-gray); color:var(--ol-text);"
                          th:text="'Pedido #' + ${p.pedidoId}"></span>
                </td>
                <td>
                    <span th:if="${p.nombre != null and !p.nombre.isEmpty() and p.nombre != 'Cliente'}"
                          class="fw-semibold d-block" style="color:var(--ol-text);" th:text="${p.nombre}"></span>
                    <span th:if="${p.clienteCorreo != null}" class="small" style="color:var(--ol-text-muted);" th:text="${p.clienteCorreo}"></span>
                </td>
                <td style="color:var(--ol-text);" th:text="${#strings.capitalize(p.metodo.name().toLowerCase())}"></td>
                <td>
                    <span th:if="${p.estado.name() == 'APROBADO'}" class="badge rounded-pill text-bg-success"><i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Aprobado</span>
                    <span th:if="${p.estado.name() == 'PENDIENTE'}" class="badge rounded-pill text-bg-warning"><i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Pendiente</span>
                    <span th:if="${p.estado.name() == 'RECHAZADO'}" class="badge rounded-pill text-bg-danger"><i class="bi bi-circle-fill" style="font-size:.5rem;"></i> Rechazado</span>
                </td>
                <td class="fw-semibold" style="color:var(--ol-gold);" th:text="'$' + ${#numbers.formatDecimal(p.total, 0, 'COMMA', 0, 'POINT')}"></td>
                <td class="small" style="color:var(--ol-text-muted);" th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy')}"></td>
                <td class="text-end">
                    <form th:action="@{/admin/pagos/{id}/estado(id=${p.id})}" method="post" class="d-inline">
                        <input type="hidden" name="estado" value="aprobado">
                        <button type="submit" th:if="${p.estado.name() != 'APROBADO'}" class="btn btn-sm me-1"
                                style="background:rgba(67,160,71,.15); color:#43A047;" title="Aprobar">
                            <i class="bi bi-check-lg"></i>
                        </button>
                    </form>
                    <form th:action="@{/admin/pagos/{id}/estado(id=${p.id})}" method="post" class="d-inline">
                        <input type="hidden" name="estado" value="rechazado">
                        <button type="submit" th:if="${p.estado.name() != 'RECHAZADO'}" class="btn btn-sm me-1"
                                style="background:rgba(211,47,47,.12); color:#EF9A9A;" title="Rechazar">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </form>
                    <a th:href="'#modal-editar-' + ${p.id}" class="btn btn-sm me-1" style="background:rgba(21,101,192,.15); color:#64B5F6;">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <form th:action="@{/admin/pagos/{id}/eliminar(id=${p.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Eliminar este pago?');">
                        <button type="submit" class="btn btn-sm" style="background:rgba(211,47,47,.12); color:#EF9A9A;" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Mobile: cards -->
    <div th:unless="${pagos.isEmpty()}" class="d-md-none d-flex flex-column gap-2">
        <div th:each="p : ${pagos}" class="card card-ol">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-start gap-2">
                    <div>
                        <p class="fw-semibold mb-0" style="color:var(--ol-white);" th:text="'Pago #' + ${p.id}"></p>
                        <p class="small mb-1" style="color:var(--ol-text-muted);" th:text="'Pedido #' + ${p.pedidoId} + ' · ' + ${#strings.capitalize(p.metodo.name().toLowerCase())}"></p>
                        <p th:if="${p.nombre != null and !p.nombre.isEmpty() and p.nombre != 'Cliente'}"
                           class="small mb-0 fw-semibold" style="color:var(--ol-gold);" th:text="${p.nombre} + (${p.clienteCorreo} != null ? ' · ' + ${p.clienteCorreo} : '')"></p>
                        <p th:unless="${p.nombre != null and !p.nombre.isEmpty() and p.nombre != 'Cliente'}"
                           class="small mb-0 text-ol-muted" th:text="${p.clienteCorreo}"></p>
                    </div>
                    <span th:if="${p.estado.name() == 'APROBADO'}" class="badge rounded-pill text-bg-success text-nowrap">Aprobado</span>
                    <span th:if="${p.estado.name() == 'PENDIENTE'}" class="badge rounded-pill text-bg-warning text-nowrap">Pendiente</span>
                    <span th:if="${p.estado.name() == 'RECHAZADO'}" class="badge rounded-pill text-bg-danger text-nowrap">Rechazado</span>
                </div>

                <div class="d-flex flex-wrap gap-1 mb-2">
                    <span style="color:var(--ol-gold);" class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(p.total, 0, 'COMMA', 0, 'POINT')}"></span>
                    <span class="badge" style="background:var(--ol-gray); color:var(--ol-text-muted);" th:text="'Fecha: ' + ${#temporals.format(p.createdAt, 'dd/MM/yy')}"></span>
                </div>

                <div class="d-flex gap-2">
                    <form th:action="@{/admin/pagos/{id}/estado(id=${p.id})}" method="post">
                        <input type="hidden" name="estado" value="aprobado">
                        <button type="submit" th:if="${p.estado.name() != 'APROBADO'}" class="btn btn-sm" style="background:rgba(67,160,71,.15); color:#43A047;">
                            <i class="bi bi-check-lg"></i>
                        </button>
                    </form>
                    <form th:action="@{/admin/pagos/{id}/estado(id=${p.id})}" method="post">
                        <input type="hidden" name="estado" value="rechazado">
                        <button type="submit" th:if="${p.estado.name() != 'RECHAZADO'}" class="btn btn-sm" style="background:rgba(211,47,47,.12); color:#EF9A9A;">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </form>
                    <a th:href="'#modal-editar-' + ${p.id}" class="btn btn-sm flex-grow-1" style="background:rgba(21,101,192,.15); color:#64B5F6;">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </a>
                    <form th:action="@{/admin/pagos/{id}/eliminar(id=${p.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este pago?');">
                        <button type="submit" class="btn btn-sm" style="background:rgba(211,47,47,.12); color:#EF9A9A;">
                            <i class="bi bi-trash"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════ MODAL: NUEVO PAGO ═══════════ -->
<div id="modal-nuevo" class="modal-css">
    <div class="modal-css-box">
        <a href="#" class="modal-css-close">&times;</a>
        <h5 class="fw-bold mb-0" style="color:var(--ol-white);">Nuevo pago</h5>
        <p class="small mb-3" style="color:var(--ol-text-muted);">Asocia el pago a un pedido existente</p>

        <div th:if="${pagoFormError != null and pagoFormId == null}" class="alert alert-danger py-2 small" th:text="${pagoFormError}"></div>

        <form th:action="@{/admin/pagos/nuevo}" method="post" th:with="d=${pagoFormNuevo}">

            <div class="mb-3">
                <label class="form-label small fw-semibold">Pedido <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text campo-icono"><i class="bi bi-box"></i></span>
                    <select name="pedidoId" class="form-select campo-icono" required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="ped : ${pedidos}" th:value="${ped.id}" th:text="'#' + ${ped.id}"
                                th:selected="${d.pedidoId == ped.id}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Método <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text campo-icono"><i class="bi bi-credit-card"></i></span>
                    <select name="metodo" class="form-select campo-icono" required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="m : ${metodosPago}" th:value="${m.valor}"
                                th:text="${#strings.capitalize(m.name().toLowerCase())}"
                                th:selected="${d.metodo != null and d.metodo.name() == m.name()}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold">Estado <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text campo-icono"><i class="bi bi-flag"></i></span>
                    <select name="estado" class="form-select campo-icono" required>
                        <option value="">-- Selecciona --</option>
                        <option th:each="e : ${estadosPago}" th:value="${e.valor}"
                                th:text="${#strings.capitalize(e.name().toLowerCase())}"
                                th:selected="${d.estado != null and d.estado.name() == e.name()}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Total <span class="text-danger">*</span></label>
                <div class="input-group">
                    <span class="input-group-text campo-icono"><i class="bi bi-currency-dollar"></i></span>
                    <input type="number" step="0.01" min="0.01" name="total" th:value="${d.total}" class="form-control campo-icono" placeholder="0.00" required>
                </div>
            </div>

            <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill btn-ol-gold">CREAR PAGO</button>
        </form>
    </div>
</div>

<!-- ═══════════ MODALES: EDITAR PAGO ═══════════ -->
<div th:each="p : ${pagos}">
    <div th:id="'modal-editar-' + ${p.id}" class="modal-css">
        <div class="modal-css-box" th:with="usarFlash=${pagoFormId != null and pagoFormId == p.id}">
            <a href="#" class="modal-css-close">&times;</a>
            <h5 class="fw-bold mb-0" style="color:var(--ol-white);">Editar pago</h5>
            <p class="small mb-3" style="color:var(--ol-text-muted);">Modificando el pago #<span th:text="${p.id}"></span></p>

            <div th:if="${usarFlash and pagoFormError != null}" class="alert alert-danger py-2 small" th:text="${pagoFormError}"></div>

            <form th:action="@{/admin/pagos/{id}/editar(id=${p.id})}" method="post">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Pedido <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text campo-icono"><i class="bi bi-box"></i></span>
                        <select name="pedidoId" class="form-select campo-icono" required>
                            <option value="">-- Selecciona --</option>
                            <option th:each="ped : ${pedidos}" th:value="${ped.id}" th:text="'#' + ${ped.id}"
                                    th:selected="${(usarFlash ? pagoForm.pedidoId : p.pedidoId) == ped.id}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Método <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text campo-icono"><i class="bi bi-credit-card"></i></span>
                        <select name="metodo" class="form-select campo-icono" required>
                            <option value="">-- Selecciona --</option>
                            <option th:each="m : ${metodosPago}" th:value="${m.valor}"
                                    th:text="${#strings.capitalize(m.name().toLowerCase())}"
                                    th:selected="${(usarFlash ? pagoForm.metodo : p.metodo) != null and (usarFlash ? pagoForm.metodo : p.metodo).name() == m.name()}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Estado <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text campo-icono"><i class="bi bi-flag"></i></span>
                        <select name="estado" class="form-select campo-icono" required>
                            <option value="">-- Selecciona --</option>
                            <option th:each="e : ${estadosPago}" th:value="${e.valor}"
                                    th:text="${#strings.capitalize(e.name().toLowerCase())}"
                                    th:selected="${(usarFlash ? pagoForm.estado : p.estado) != null and (usarFlash ? pagoForm.estado : p.estado).name() == e.name()}"></option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Total <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text campo-icono"><i class="bi bi-currency-dollar"></i></span>
                        <input type="number" step="0.01" min="0.01" name="total" class="form-control campo-icono" required
                               th:value="${usarFlash} ? ${pagoForm.total} : ${p.total}">
                    </div>
                </div>

                <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill btn-ol-gold">GUARDAR CAMBIOS</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
