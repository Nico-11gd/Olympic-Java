<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olympic Store — Panel de Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/admin-header :: admin-header(currentPage='inicio')}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-4">

    <!-- ═══════════ VISTA ADMIN: dashboard con métricas ═══════════ -->
    <div sec:authorize="hasRole('ADMIN')">
        <div class="d-flex flex-wrap align-items-end justify-content-between gap-2 mb-4">
            <div>
                <span class="badge rounded-pill badge-ol-title mb-2">PANEL DE ADMINISTRACIÓN</span>
                <h1 class="fw-bold mb-0" style="color:var(--ol-white);">
                    Bienvenido, <span sec:authentication="name"></span>
                </h1>
                <p class="mb-0 mt-1" style="color:var(--ol-text-muted);">El estado general de tu tienda.</p>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-box-seam fs-3" style="color:var(--ol-gold);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${totalProductos}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Productos</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-check-circle fs-3" style="color:var(--ol-success);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${productosActivos}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Activos</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-x-circle fs-3" style="color:var(--ol-text-muted);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${productosInactivos}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Inactivos</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-boxes fs-3" style="color:var(--ol-info);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${stockTotal}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Unid. en stock</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-exclamation-triangle fs-3" style="color:var(--ol-warning);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${stockBajo}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Stock bajo</span>
                </div>
            </div>
            <div class="col-6 col-md-4 col-xl-2">
                <div class="card card-ol h-100 text-center p-3">
                    <i class="bi bi-tags fs-3" style="color:var(--ol-success);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${totalCategorias}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Categorías</span>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card card-ol p-4 text-center">
                    <i class="bi bi-people fs-3" style="color:var(--ol-gold);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${totalUsuarios}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Usuarios registrados</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-ol p-4 text-center">
                    <i class="bi bi-shield-lock fs-3" style="color:var(--ol-gold-dark);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${totalAdmins}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Administradores</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-ol p-4 text-center">
                    <i class="bi bi-person fs-3" style="color:var(--ol-info);"></i>
                    <span class="display-6 fw-bold mt-2" style="color:var(--ol-white);" th:text="${totalClientes}">0</span>
                    <span class="small" style="color:var(--ol-text-muted);">Clientes</span>
                </div>
            </div>
        </div>

        <h6 class="heading-ol text-uppercase mb-3">Accesos rápidos</h6>
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/admin/productos}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-box-seam fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Productos</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/admin/usuarios}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-people fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Usuarios</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/admin/pagos}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-credit-card fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Pagos</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/admin/inventario}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-boxes fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Inventario</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/admin/reportes}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-bar-chart fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Reportes</span>
                </a>
            </div>
            <div class="col-6 col-md-4 col-lg-2">
                <a th:href="@{/}" class="card card-ol text-decoration-none p-4 text-center h-100">
                    <i class="bi bi-shop fs-2" style="color:var(--ol-gold);"></i>
                    <span class="fw-semibold mt-2" style="color:var(--ol-white);">Ir a la tienda</span>
                </a>
            </div>
        </div>
    </div>

</div>

</body>
</html>
