<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Producto — OLIMPIC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/tienda.css}" href="/css/tienda.css" />
    <link rel="stylesheet" th:href="@{/css/producto.css}" href="/css/producto.css" />
</head>
<body>

<div th:replace="~{fragments/iconos :: sprite}"></div>
<div th:replace="~{fragments/navbar-publico :: navbar}"></div>

<div class="container py-4">
    <a href="/" class="pd-volver">
        <svg class="icon icon-xs"><use href="#icon-arrow-left"/></svg>
        <span>Volver al catálogo</span>
    </a>

    <div class="text-center py-5" id="pd-cargando">
        <div class="spinner-border" style="color:var(--gold)" role="status"></div>
    </div>

    <div class="row g-5 pd-contenido" id="pd-contenido" hidden>
        <div class="col-md-6">
            <div class="pd-imagen-wrap" id="pd-imagen-wrap">
                <img class="pd-imagen" id="pd-imagen" alt="" />
                <svg class="icon pd-imagen-placeholder"><use href="#icon-shirt"/></svg>
            </div>
        </div>

        <div class="col-md-6">
            <div class="pd-info">
                <p class="pd-categoria" id="pd-categoria"></p>
                <h1 class="pd-nombre" id="pd-nombre"></h1>

                <div class="pd-precios">
                    <span class="pd-precio" id="pd-precio"></span>
                    <span class="pd-precio-anterior" id="pd-precio-anterior" hidden></span>
                    <span class="pd-badge-descuento" id="pd-badge-descuento" hidden></span>
                </div>

                <p class="pd-stock" id="pd-stock"></p>

                <div class="pd-separador"></div>

                <div class="pd-opciones mb-3" id="pd-tallas-wrap" hidden>
                    <p class="pd-opciones-label">Talla</p>
                    <div class="pd-opciones-botones" id="pd-tallas"></div>
                </div>

                <div class="pd-opciones mb-3" id="pd-colores-wrap" hidden>
                    <p class="pd-opciones-label">Color</p>
                    <div class="pd-opciones-botones" id="pd-colores"></div>
                </div>

                <div class="pd-opciones mb-4">
                    <p class="pd-opciones-label">Cantidad</p>
                    <div class="pd-stepper">
                        <button type="button" id="pd-cant-menos" aria-label="Menos"><svg class="icon"><use href="#icon-minus"/></svg></button>
                        <span id="pd-cant-valor">1</span>
                        <button type="button" id="pd-cant-mas" aria-label="Más"><svg class="icon"><use href="#icon-plus"/></svg></button>
                    </div>
                </div>

                <button type="button" class="pd-btn-comprar" id="pd-btn-comprar">Añadir al carrito</button>

                <div class="pd-descripcion-wrap" id="pd-descripcion-wrap" hidden>
                    <p class="pd-descripcion-titulo">Descripción</p>
                    <p class="pd-descripcion" id="pd-descripcion"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="pd-relacionados-wrap" id="pd-relacionados-wrap" hidden>
        <h2 class="pd-relacionados-titulo">También te puede gustar</h2>
        <div class="row row-cols-2 row-cols-md-4 g-4" id="pd-relacionados"></div>
    </div>
</div>

<div th:replace="~{fragments/producto-card :: tarjeta}"></div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/notificaciones.js}" src="/js/notificaciones.js"></script>
<script th:src="@{/js/auth.js}" src="/js/auth.js"></script>
<script th:src="@{/js/api.js}" src="/js/api.js"></script>
<script th:src="@{/js/navbar-publico.js}" src="/js/navbar-publico.js"></script>
<script th:src="@{/js/precios.js}" src="/js/precios.js"></script>
<script th:src="@{/js/producto-card.js}" src="/js/producto-card.js"></script>
<script th:src="@{/js/producto.js}" src="/js/producto.js"></script>
</body>
</html>
