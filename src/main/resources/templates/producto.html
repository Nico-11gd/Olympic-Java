<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${producto.nombre} + ' - Olympic Store'">Producto - Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-4" style="background:var(--ol-bg);">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/}" style="color:var(--ol-text-muted); text-decoration:none;">Inicio</a></li>
            <li class="breadcrumb-item" th:if="${producto.categoria != null}">
                <a th:href="@{/coleccion(categoria=${producto.categoriaId})}" style="color:var(--ol-text-muted); text-decoration:none;" th:text="${producto.categoria}"></a>
            </li>
            <li class="breadcrumb-item active fw-semibold" style="color:var(--ol-white);" th:text="${producto.nombre}"></li>
        </ol>
    </nav>

    <div class="row g-4 mb-5">

        <!-- IMAGENES: carrusel -->
        <div class="col-md-5">
            <div class="position-relative">
            <div th:if="${producto.imagenUrl != null}" id="carouselProducto"
                 class="carousel slide rounded-4 overflow-hidden product-detail-ol">
                <div class="carousel-inner">
                    <div th:each="img, stat : ${producto.imagenes}" class="carousel-item"
                         th:classappend="${stat.index == 0} ? 'active'">
                        <a th:href="'#zoom-' + ${stat.index}" class="d-block position-relative text-decoration-none">
                            <div class="ratio ratio-4x3" style="background:var(--ol-gray);">
                                <img th:src="@{${img}}" th:alt="${producto.nombre}"
                                     class="w-100 h-100" style="object-fit:cover;" alt="">
                            </div>
                            <span class="position-absolute bottom-0 end-0 m-2 badge rounded-pill"
                                  style="background:rgba(0,0,0,.7); color:#fff; font-size:.7rem; backdrop-filter:blur(4px);">
                                <i class="bi bi-search-plus me-1"></i>Ver imagen completa
                            </span>
                        </a>
                    </div>
                </div>
                <button th:if="${#lists.size(producto.imagenes) > 1}" class="carousel-control-prev" type="button"
                        data-bs-target="#carouselProducto" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"
                          style="background-color:rgba(212,175,55,.75); border-radius:50%; padding:14px; box-shadow:0 2px 6px rgba(0,0,0,.4);"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button th:if="${#lists.size(producto.imagenes) > 1}" class="carousel-control-next" type="button"
                        data-bs-target="#carouselProducto" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"
                          style="background-color:rgba(212,175,55,.75); border-radius:50%; padding:14px; box-shadow:0 2px 6px rgba(0,0,0,.4);"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>

                <div th:if="${#lists.size(producto.imagenes) > 1}" class="d-flex justify-content-center gap-2 mt-2 pb-2">
                    <button th:each="img, stat : ${producto.imagenes}" type="button"
                            class="btn p-0 border border-2 rounded-2 overflow-hidden"
                            th:styleappend="${stat.index == 0} ? 'border-color:var(--ol-gold);' : 'border-color:var(--ol-border);'"
                            th:attr="data-bs-target='#carouselProducto', data-bs-slide-to=${stat.index}, aria-label=${'Ir a imagen ' + stat.count}">
                        <img th:src="@{${img}}" th:alt="''" style="width:46px; height:46px; object-fit:cover; display:block;">
                    </button>
                </div>
            </div>

            <div th:unless="${producto.imagenUrl != null}"
                 class="ratio ratio-4x3 rounded-4 overflow-hidden product-detail-ol">
                <div class="d-flex align-items-center justify-content-center h-100" style="background:var(--ol-gray);">
                    <i class="bi bi-image text-ol-muted" style="font-size:4rem;"></i>
                </div>
            </div>

<span th:if="${producto.stock == 0}" class="sold-out-tag">Sold Out</span>
        </div>

            <div th:each="img, stat : ${producto.imagenes}" th:id="'zoom-' + ${stat.index}" class="zoom-overlay">
                <a href="#" class="zoom-close">&times;</a>
                <img th:src="@{${img}}" th:alt="${producto.nombre}">
                <span class="zoom-hint">Haz clic fuera o en &times; para cerrar</span>
            </div>
        </div>

        <!-- INFORMACION -->
        <div class="col-md-7">
            <form th:action="@{/carrito/agregar}" method="post" id="formCarrito">
                <input type="hidden" name="productoId" th:value="${producto.id}">
                <p th:if="${producto.categoria != null}" class="text-uppercase small fw-semibold mb-1"
                   style="color:var(--ol-gold); letter-spacing:1px;" th:text="${producto.categoria}"></p>

                <h1 class="fw-bold mb-2" style="color:var(--ol-white);" th:text="${producto.nombre}"></h1>

                <p th:if="${producto.codigo != null}" class="small mb-3" style="color:var(--ol-text-muted);" th:text="'SKU: ' + ${producto.codigo}"></p>

                <!-- PRECIO -->
                <div class="mb-3 pb-3" style="border-bottom:1px solid var(--ol-border);">
                    <span th:if="${producto.precioPromocion != null}">
                        <span class="fs-3 fw-bold" style="color:var(--ol-gold);"
                              th:text="'$' + ${#numbers.formatDecimal(producto.precioPromocion, 0, 'COMMA', 0, 'POINT')}"></span>
                        <span class="text-ol-muted text-decoration-line-through ms-2"
                              th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                        <span class="badge bg-danger ms-2">Oferta</span>
                    </span>
                    <span th:unless="${producto.precioPromocion != null}" class="fs-3 fw-bold" style="color:var(--ol-gold);"
                          th:text="'$' + ${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                </div>

                <!-- DESCRIPCION -->
                <div th:if="${producto.descripcion != null}" class="mb-4">
                    <h6 class="fw-bold text-uppercase mb-2" style="color:var(--ol-white); letter-spacing:1px;">Descripción</h6>
                    <p style="color:var(--ol-text-muted);" th:text="${producto.descripcion}"></p>
                </div>

                <!-- TALLAS -->
                <div th:if="${!producto.tallas.isEmpty()}" class="mb-4">
                    <h6 class="fw-bold text-uppercase mb-2" style="color:var(--ol-white); letter-spacing:1px;">Talla</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <span th:each="t : ${producto.tallas}" class="d-inline-block">
                            <input type="radio" class="btn-check" name="talla" th:value="${t}" th:id="'talla-' + ${t}" autocomplete="off">
                            <label class="btn btn-sm fw-semibold btn-talla-seleccion border border-2 rounded-2 shadow-sm"
                                   style="background:var(--ol-gray); color:var(--ol-text); min-width:44px; border-color:var(--ol-border);"
                                   th:for="'talla-' + ${t}"
                                   th:text="${t}"></label>
                        </span>
                    </div>
                </div>

                <!-- COLORES -->
                <div th:if="${!producto.colores.isEmpty()}" class="mb-4">
                    <h6 class="fw-bold text-uppercase mb-2" style="color:var(--ol-white); letter-spacing:1px;">Color</h6>
                    <div class="d-flex flex-wrap gap-2">
                        <span th:each="c : ${producto.colores}" class="d-inline-block">
                            <input type="radio" class="btn-check" name="color" th:value="${c}" th:id="'color-' + ${c}" autocomplete="off">
                            <label class="btn btn-sm fw-semibold btn-talla-seleccion border border-2 rounded-2 shadow-sm"
                                   style="background:var(--ol-gray); color:var(--ol-text); min-width:44px; border-color:var(--ol-border);"
                                   th:for="'color-' + ${c}"
                                   th:text="${c}"></label>
                        </span>
                    </div>
                </div>

                <!-- CANTIDAD -->
                <div class="mb-3">
                    <h6 class="fw-bold text-uppercase mb-2" style="color:var(--ol-white); letter-spacing:1px;">Cantidad</h6>
                    <div class="d-flex align-items-center gap-3">
                        <button type="button" id="qtyMenos" class="qty-btn">−</button>
                        <input type="number" name="cantidad" id="cantidadInput" value="1"
                               min="1" th:max="${producto.stock}" th:attr="data-stock=${producto.stock}"
                               class="form-control form-control-sm text-center fw-semibold"
                               style="max-width:80px; background:var(--ol-gray); border:1.5px solid var(--ol-border); color:var(--ol-text); font-size:1rem;">
                        <button type="button" id="qtyMas" class="qty-btn">+</button>
                    </div>
                </div>

                <!-- STOCK -->
                <div class="mb-4">
                    <p th:if="${producto.stock > 0}" class="small fw-semibold mb-0" style="color:var(--ol-success);">
                        <i class="bi bi-check-circle-fill me-1"></i> Disponibles: <span th:text="${producto.stock}"></span> unidades
                    </p>
                    <p th:unless="${producto.stock > 0}" class="small fw-semibold mb-0" style="color:var(--ol-danger);">
                        <i class="bi bi-x-circle-fill me-1"></i> Sin stock disponible
                    </p>
                </div>

                <!-- BOTON CARRITO -->
                <div id="errorVariacion" class="alert alert-danger py-2 small d-none mb-3" role="alert"></div>
                <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill btn-ol-gold"
                        style="letter-spacing:1px;"
                        th:disabled="${producto.stock == 0}">
                    <i class="bi bi-cart-plus me-2"></i> AÑADIR AL CARRITO
                </button>
            </form>
        </div>
    </div>

    <!-- TAMBIEN TE PUEDE GUSTAR -->
    <div th:unless="${relacionados.isEmpty()}" class="mb-5">
        <h5 class="heading-ol text-uppercase mb-3">También te puede gustar</h5>
        <div class="row row-cols-2 row-cols-md-4 g-3">
            <div class="col" th:each="r : ${relacionados}">
                <a th:href="@{/producto(id=${r.id})}" class="text-decoration-none">
                    <div class="card h-100 border-0 rounded-4 overflow-hidden product-card-ol">
                        <div class="ratio ratio-4x3 product-img-wrap position-relative">
                            <img th:if="${r.imagenUrl != null}" th:src="@{${r.imagenUrl}}"
                                 class="w-100 h-100" style="object-fit:cover;" alt="">
                            <div th:unless="${r.imagenUrl != null}"
                                 class="d-flex align-items-center justify-content-center h-100">
                                <i class="bi bi-bag text-ol-muted fs-1"></i>
                            </div>
                            <span th:if="${r.stock == 0}" class="sold-out-tag">Sold Out</span>
                        </div>
                        <div class="card-body p-2">
                            <p class="product-name mb-1 text-truncate" th:text="${r.nombre}"></p>
                            <div>
                                <span th:if="${r.precioPromocion != null}">
                                    <span class="product-price" style="font-size:.9rem;"
                                          th:text="'$' + ${#numbers.formatDecimal(r.precioPromocion, 0, 'COMMA', 0, 'POINT')}"></span>
                                    <span class="text-ol-muted text-decoration-line-through small"
                                          th:text="'$' + ${#numbers.formatDecimal(r.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                                    <span class="badge bg-danger ms-1" th:text="'-' + ${r.descuentoPorcentaje} + '%'"></span>
                                </span>
                                <span th:unless="${r.precioPromocion != null}" class="product-price" style="font-size:.9rem;"
                                      th:text="'$' + ${#numbers.formatDecimal(r.precio, 0, 'COMMA', 0, 'POINT')}"></span>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

</div>

<footer class="footer-ol text-center py-4 mt-5 small">
    &copy; 2026 Olympic Store. Todos los derechos reservados.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    var input = document.getElementById('cantidadInput');
    var menos = document.getElementById('qtyMenos');
    var mas = document.getElementById('qtyMas');
    if (!input || !menos || !mas) return;
    var stock = parseInt(input.getAttribute('data-stock'), 10) || 0;

    function actualizarEstado() {
        var val = parseInt(input.value, 10) || 1;
        menos.classList.toggle('disabled', val <= 1);
        mas.classList.toggle('disabled', val >= stock);
    }
    menos.addEventListener('click', function () {
        var val = parseInt(input.value, 10) || 1;
        if (val > 1) input.value = val - 1;
        actualizarEstado();
    });
    mas.addEventListener('click', function () {
        var val = parseInt(input.value, 10) || 1;
        if (val < stock) input.value = val + 1;
        actualizarEstado();
    });
    input.addEventListener('change', actualizarEstado);
    actualizarEstado();
})();

(function () {
    var form = document.getElementById('formCarrito');
    var errorDiv = document.getElementById('errorVariacion');
    if (!form || !errorDiv) return;

    form.addEventListener('submit', function (e) {
        var tallas = form.querySelectorAll('input[name="talla"]');
        var colores = form.querySelectorAll('input[name="color"]');
        var faltantes = [];
        if (tallas.length > 0 && !form.querySelector('input[name="talla"]:checked')) {
            faltantes.push('una talla');
        }
        if (colores.length > 0 && !form.querySelector('input[name="color"]:checked')) {
            faltantes.push('un color');
        }
        if (faltantes.length > 0) {
            e.preventDefault();
            e.stopPropagation();
            errorDiv.textContent = 'Debes seleccionar ' + faltantes.join(' y ') + ' antes de añadir al carrito.';
            errorDiv.classList.remove('d-none');
            errorDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
            errorDiv.classList.add('d-none');
        }
    });

    form.addEventListener('change', function (e) {
        if (e.target && (e.target.name === 'talla' || e.target.name === 'color')) {
            errorDiv.classList.add('d-none');
        }
    });
})();
</script>
</body>
</html>
