<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
    <script th:src="@{/js/tema-head.js}"></script>
</head>
<body>
<button type="button" onclick="toggleTema()" class="btn position-fixed"
        style="top:16px; right:16px; z-index:999; background:var(--ol-gray); color:var(--ol-text); border:1px solid var(--ol-border);">
    <i id="temaIcono" class="bi bi-moon-stars"></i>
</button>
<div class="container-fluid px-3 px-md-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-ol shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:50px; width:auto; object-fit:contain;" class="mb-3">
                    <h3 class="fw-bold mb-2" style="color:var(--ol-white);">Recuperar contraseña</h3>
                    <p class="small mb-4" style="color:var(--ol-text-muted);">Te enviaremos un código a tu correo para restablecerla.</p>

                    <form th:action="@{/recuperar-password}" method="post" class="needs-validation" novalidate>
                        <div class="mb-4 text-start">
                            <label class="form-label fw-semibold">Correo electrónico <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="correo" class="form-control" placeholder="tucorreo@ejemplo.com" required autofocus>
                            </div>
                            <div class="invalid-feedback">Ingresa un correo válido.</div>
                        </div>

                        <button type="submit" class="btn w-100 fw-semibold py-2 rounded-pill btn-ol-gold">
                            <i class="bi bi-envelope me-1"></i> Enviar código
                        </button>
                    </form>

                    <p class="mt-4 mb-0">
                        <a th:href="@{/login}" class="small" style="color:var(--ol-text-muted);">&larr; Volver al inicio de sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/tema.js}"></script>
</body>
</html>
