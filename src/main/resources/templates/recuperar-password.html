<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - OLIMPIC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background:#F2E9D8;">
<div class="container-fluid px-3 px-md-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">
                    <span class="badge rounded-pill mb-2" style="background:#D4AF37; color:#241E14;">OLIMPIC</span>
                    <h3 class="fw-bold mb-2" style="color:#241E14;">Recuperar contraseña</h3>
                    <p class="text-muted small mb-4">Te enviaremos un código a tu correo para restablecerla.</p>

                    <form th:action="@{/recuperar-password}" method="post" class="needs-validation" novalidate>
                        <div class="mb-4 text-start">
                            <label class="form-label fw-semibold">Correo electrónico <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" name="correo" class="form-control" placeholder="tucorreo@ejemplo.com" required autofocus>
                            </div>
                            <div class="invalid-feedback">Ingresa un correo válido (ej: usuario@dominio.com).</div>
                        </div>

                        <button type="submit" class="btn w-100 fw-semibold py-2" style="background:#D4AF37; color:#241E14;">
                            <i class="bi bi-envelope me-1"></i> Enviar código
                        </button>
                    </form>

                    <p class="mt-4 mb-0">
                        <a th:href="@{/login}" class="small text-muted">&larr; Volver al inicio de sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
