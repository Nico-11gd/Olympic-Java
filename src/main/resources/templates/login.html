<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<header class="d-flex align-items-center justify-content-between px-3 px-md-4 py-2 header-ol position-relative">
    <a th:href="@{/}" class="btn btn-sm fw-semibold btn-ol-dark">
        <i class="bi bi-house me-1"></i>Inicio
    </a>
    <a th:href="@{/}" class="btn btn-sm fw-semibold btn-ol-outline">
        <i class="bi bi-grid me-1"></i>Catálogo
    </a>
    <img th:src="@{/marca/logo.png}" alt="Olympic Store"
         style="height:48px; width:auto; object-fit:contain; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);">
</header>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-ol shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">

                    <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:120px; width:auto; object-fit:contain;" class="mb-4">
                    <ul class="nav nav-tabs justify-content-center mb-4" style="border-color:var(--ol-border);">
                        <li class="nav-item">
                            <span class="nav-link active fw-bold" style="color:var(--ol-gold); border-bottom:2px solid var(--ol-gold);">
                                <i class="bi bi-person me-1"></i>Iniciar sesión
                            </span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" style="color:var(--ol-text-muted);" th:href="@{/registro}">
                                <i class="bi bi-file-text me-1"></i>Registrarse
                            </a>
                        </li>
                    </ul>

                    <div th:if="${param.error}" class="alert alert-danger p-2 fs-6">
                        <i class="bi bi-exclamation-triangle me-1"></i>Correo o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info p-2 fs-6">
                        Sesión cerrada correctamente.
                    </div>
                    <div th:if="${mensaje}" class="alert alert-success p-2 fs-6" th:text="${mensaje}"></div>

                    <form th:action="@{/login}" method="post" class="text-start needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Correo electrónico <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="correo" class="form-control" placeholder="tucorreo@ejemplo.com" autofocus required>
                            </div>
                            <div class="invalid-feedback">Ingresa un correo válido.</div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="text-end mb-3">
                            <a th:href="@{/recuperar-password}" class="small" style="color:var(--ol-gold);">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill btn-ol-gold" style="letter-spacing:1px;">
                            INICIAR SESIÓN &rarr;
                        </button>

                        <a th:href="@{/}" class="btn w-100 mt-2 py-2 rounded-3 btn-ol-dark">
                            &larr; Volver al inicio sin cuenta
                        </a>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
