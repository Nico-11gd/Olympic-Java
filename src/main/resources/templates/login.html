<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Olimpic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background:#F2E9D8;">

<header class="d-flex align-items-center justify-content-between px-4 py-2" style="background:#FFFDF6; border-bottom:1px solid #E6D9B8;">
    <a th:href="@{/}" class="btn btn-sm fw-semibold" style="background:#F2E9D8; color:#241E14;">
        <i class="bi bi-house me-1"></i>Inicio
    </a>
    <span class="fw-bold d-flex align-items-center gap-2" style="color:#D4AF37; letter-spacing:2px;"><img th:src="@{/marca/logo.png}" alt="Olimpic" style="height:30px; width:30px; object-fit:contain;">OLIMPIC</span>
    <a th:href="@{/}" class="btn btn-sm fw-semibold" style="background:rgba(212,175,55,.22); color:#241E14;">
        <i class="bi bi-grid me-1"></i>Catálogo
    </a>
</header>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">

                    <img th:src="@{/marca/logo.png}" alt="Olimpic" style="height:64px; width:64px; object-fit:contain;" class="mb-2">
                    <h4 class="fw-bold mb-0" style="color:#241E14;">Olimpic</h4>
                    <p class="text-muted small mb-4">Tu tienda de ropa favorita</p>

                    <ul class="nav nav-tabs justify-content-center mb-4">
                        <li class="nav-item">
                            <span class="nav-link active fw-bold" style="color:#8A6D1A; border-bottom:2px solid #D4AF37;">
                                <i class="bi bi-person me-1"></i>Iniciar sesión
                            </span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-muted" th:href="@{/registro}">
                                <i class="bi bi-file-text me-1"></i>Registrarse
                            </a>
                        </li>
                    </ul>

                    <div th:if="${param.error}" class="alert alert-danger p-2 fs-6">
                        <i class="bi bi-exclamation-triangle me-1"></i>Correo o contraseña incorrectos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info p-2 fs-6">
                        Sesión cerrada correctamente.
                    </div>
                    <div th:if="${mensaje}" class="alert alert-success p-2 fs-6" th:text="${mensaje}"></div>

                    <form th:action="@{/login}" method="post" class="text-start needs-validation" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Correo electrónico <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" name="correo" class="form-control" placeholder="tucorreo@ejemplo.com" autofocus required>
                            </div>
                            <div class="invalid-feedback">Ingresa un correo válido (ej: usuario@dominio.com).</div>
                        </div>

                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required minlength="6">
                            </div>
                            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
                        </div>

                        <div class="text-end mb-3">
                            <a th:href="@{/recuperar-password}" class="small" style="color:#8A6D1A;">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill" style="background:#D4AF37; color:#241E14; letter-spacing:1px;">
                            INICIAR SESIÓN &rarr;
                        </button>

                        <a th:href="@{/}" class="btn w-100 mt-2 py-2 rounded-3" style="border:1.5px solid #E6D9B8; color:#8A7F63;">
                            &larr; Volver al inicio sin cuenta
                        </a>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
