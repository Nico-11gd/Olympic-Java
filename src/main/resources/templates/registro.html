<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Olympic Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/olympic.css}" rel="stylesheet">
</head>
<body>

<header class="d-flex align-items-center justify-content-between px-3 px-md-4 py-2 header-ol">
    <a th:href="@{/}" class="btn btn-sm fw-semibold btn-ol-dark">
        <i class="bi bi-house me-1"></i>Inicio
    </a>
    <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:48px; width:auto; object-fit:contain;">
    <a th:href="@{/}" class="btn btn-sm fw-semibold btn-ol-outline">
        <i class="bi bi-grid me-1"></i>Catálogo
    </a>
</header>

<div class="container-fluid px-3 px-md-4 px-lg-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-ol shadow border-0 rounded-4">
                <div class="card-body p-4 text-center">

                    <img th:src="@{/marca/logo.png}" alt="Olympic Store" style="height:120px; width:auto; object-fit:contain;" class="mb-4">
                    <ul class="nav nav-tabs justify-content-center mb-4" style="border-color:var(--ol-border);">
                        <li class="nav-item">
                            <a class="nav-link" style="color:var(--ol-text-muted);" th:href="@{/login}">
                                <i class="bi bi-person me-1"></i>Iniciar sesión
                            </a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link active fw-bold" style="color:var(--ol-gold); border-bottom:2px solid var(--ol-gold);">
                                <i class="bi bi-file-text me-1"></i>Registrarse
                            </span>
                        </li>
                    </ul>

                    <div th:if="${error}" class="alert alert-danger p-2 fs-6" th:text="${error}"></div>

                    <form th:action="@{/registro}" th:object="${registro}" method="post" class="text-start needs-validation" novalidate>
                        <div class="mb-3 campo-validacion">
                            <label class="form-label small fw-semibold">Nombre completo <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Juan Pérez" required minlength="2" pattern="[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+" autofocus>
                            </div>
                            <div class="invalid-feedback">Mínimo 2 caracteres. Solo letras y espacios.</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="mb-3 campo-validacion">
                            <label class="form-label small fw-semibold">Correo electrónico <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" th:field="*{correo}" class="form-control" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                            <div class="invalid-feedback">Ingresa un correo válido.</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                        </div>

                        <div class="mb-4 campo-validacion">
                            <label class="form-label small fw-semibold">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control" placeholder="Ej: Segura1!" required minlength="8" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).+">
                            </div>
                            <div class="invalid-feedback">Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un símbolo.</div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill btn-ol-gold" style="letter-spacing:1px;">
                            CREAR CUENTA &rarr;
                        </button>
                    </form>

                    <p class="mt-4 mb-0 small">
                        ¿Ya tienes cuenta?
                        <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color:var(--ol-gold);">Inicia sesión aquí</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        const form = document.querySelector('form.needs-validation');
        const campos = form.querySelectorAll('.campo-validacion');

        // Reutiliza las reglas ya declaradas en el HTML (required, minlength,
        // pattern, type="email") a través de la Constraint Validation API,
        // en vez de duplicarlas con expresiones regulares en JS.
        function validarCampo(campo) {
            const input = campo.querySelector('.form-control');
            const feedback = campo.querySelector('.invalid-feedback');
            const esValido = input.checkValidity();

            input.classList.toggle('is-invalid', !esValido);
            input.classList.toggle('is-valid', esValido);
            if (feedback) {
                feedback.classList.toggle('d-block', !esValido);
            }

            return esValido;
        }

        campos.forEach(function (campo) {
            const input = campo.querySelector('.form-control');
            input.addEventListener('input', function () { validarCampo(campo); });
        });

        form.addEventListener('submit', function (event) {
            let formularioValido = true;

            campos.forEach(function (campo) {
                if (!validarCampo(campo)) {
                    formularioValido = false;
                }
            });

            if (!formularioValido) {
                event.preventDefault();
                event.stopPropagation();
            }

            form.classList.add('was-validated');
        });
    })();
</script>
</body>
</html>
