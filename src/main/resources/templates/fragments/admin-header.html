<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="admin-header(currentPage)">

<!-- ════════════════════════════════════════════════════════════════
     SIDEBAR (menú lateral hamburguesa) con Bootstrap Offcanvas.
     Se diferencia por rol: Admin ve todas las secciones; Cliente ve
     solo su dashboard y su cuenta. Sin JS propio ni CSS personalizado.
     ════════════════════════════════════════════════════════════════ -->
<div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="adminSidebar"
     aria-labelledby="adminSidebarLabel"
     style="width:300px; background-color:#241E14;">

    <!-- Cabecera del menú -->
    <div class="offcanvas-header border-bottom" style="border-color:rgba(255,255,255,.1)!important;">
        <div class="d-flex align-items-center gap-2" id="adminSidebarLabel">
            <img th:src="@{/marca/logo.png}" alt="Olimpic" style="height:32px; width:32px; object-fit:contain;">
            <div>
                <span class="fw-bold d-block text-uppercase" style="color:#D4AF37; letter-spacing:2px; font-size:.95rem;">Olimpic</span>
                <span class="d-block small" style="color:rgba(255,255,255,.55); font-size:.7rem;">Panel de administración</span>
            </div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <!-- Cuerpo: enlaces agrupados -->
    <div class="offcanvas-body p-0 d-flex flex-column overflow-hidden">
        <nav class="flex-grow-1 overflow-auto py-2">

            <!-- PRINCIPAL (visible para todos los roles) -->
            <p class="text-uppercase small fw-semibold px-3 mt-2 mb-1"
               style="color:rgba(255,255,255,.35); font-size:.65rem; letter-spacing:1px;">Principal</p>
            <a th:href="@{/admin}" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none"
               th:classappend="${currentPage == 'inicio'} ? 'border-start' : ''"
               style="border-color:#D4AF37!important; border-width:3px!important; color:#FFFDF6;"
               th:styleappend="${currentPage == 'inicio'} ? 'background:rgba(212,175,55,.15);' : ''">
                <i class="bi bi-speedometer2 fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                <span class="fw-semibold">Inicio</span>
            </a>

            <!-- ===== Secciones exclusivas de ADMIN ===== -->
            <div sec:authorize="hasRole('ADMIN')">

                <p class="text-uppercase small fw-semibold px-3 mt-3 mb-1"
                   style="color:rgba(255,255,255,.35); font-size:.65rem; letter-spacing:1px;">Gestión</p>
                <a th:href="@{/admin/productos}" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none"
                   th:classappend="${currentPage == 'productos'} ? 'border-start' : ''"
                   style="border-color:#D4AF37!important; border-width:3px!important; color:#FFFDF6;"
                   th:styleappend="${currentPage == 'productos'} ? 'background:rgba(212,175,55,.15);' : ''">
                    <i class="bi bi-box-seam fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Productos</span>
                </a>
                <a th:href="@{/admin/usuarios}" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none"
                   th:classappend="${currentPage == 'usuarios'} ? 'border-start' : ''"
                   style="border-color:#D4AF37!important; border-width:3px!important; color:#FFFDF6;"
                   th:styleappend="${currentPage == 'usuarios'} ? 'background:rgba(212,175,55,.15);' : ''">
                    <i class="bi bi-people fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Usuarios</span>
                </a>

                <p class="text-uppercase small fw-semibold px-3 mt-3 mb-1"
                   style="color:rgba(255,255,255,.35); font-size:.65rem; letter-spacing:1px;">Comercial</p>
                <a href="#ventas" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none" style="color:#FFFDF6;">
                    <i class="bi bi-cart-check fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Ventas</span>
                </a>
                <a href="#reportes" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none" style="color:#FFFDF6;">
                    <i class="bi bi-bar-chart fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Reportes</span>
                </a>
                <a href="#pagos" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none" style="color:#FFFDF6;">
                    <i class="bi bi-credit-card fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Pagos</span>
                </a>
                <a href="#factura" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none" style="color:#FFFDF6;">
                    <i class="bi bi-receipt fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Factura</span>
                </a>

                <p class="text-uppercase small fw-semibold px-3 mt-3 mb-1"
                   style="color:rgba(255,255,255,.35); font-size:.65rem; letter-spacing:1px;">Operación</p>
                <a href="#devoluciones" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none" style="color:#FFFDF6;">
                    <i class="bi bi-arrow-counterclockwise fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Devoluciones</span>
                </a>
                <a href="#inventario" class="d-flex align-items-center gap-3 px-3 py-2 text-decoration-none" style="color:#FFFDF6;">
                    <i class="bi bi-boxes fs-5" style="color:#D4AF37; width:22px; text-align:center;"></i>
                    <span class="fw-semibold">Inventario</span>
                </a>
            </div>
        </nav>

        <!-- Pie del menú: cuenta + cerrar sesión -->
        <div class="border-top p-3 d-flex align-items-center justify-content-between" style="border-color:rgba(255,255,255,.1)!important;">
            <div class="d-flex align-items-center gap-2">
                <span class="d-flex align-items-center justify-content-center rounded-circle fw-bold"
                      style="width:34px; height:34px; background:rgba(212,175,55,.2); color:#D4AF37; font-size:.85rem;">
                    <i class="bi bi-person-fill"></i>
                </span>
                <span class="small fw-semibold text-truncate" style="color:#FFFDF6; max-width:130px;" sec:authentication="name"></span>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm fw-semibold text-nowrap" style="background:rgba(212,175,55,.2); color:#D4AF37;">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </form>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     HEADER con el botón hamburguesa (3 rayas)
     ════════════════════════════════════════════════════════════════ -->
<header class="d-flex flex-wrap align-items-center justify-content-between px-4 py-2 gap-2"
        style="background:#FFFDF6; border-bottom:1px solid #E6D9B8;">
    <div class="d-flex align-items-center gap-3">
        <button class="btn p-0 border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#adminSidebar" aria-controls="adminSidebar"
                title="Abrir menú">
            <span class="d-inline-flex flex-column gap-1 p-1 rounded" style="background:#F2E9D8;">
                <span class="d-block" style="width:22px; height:3px; background:#241E14; border-radius:2px;"></span>
                <span class="d-block" style="width:22px; height:3px; background:#241E14; border-radius:2px;"></span>
                <span class="d-block" style="width:22px; height:3px; background:#241E14; border-radius:2px;"></span>
            </span>
        </button>
        <a th:href="@{/}" class="btn btn-sm fw-semibold" style="background:#F2E9D8; color:#241E14;">
            <i class="bi bi-shop me-1"></i>Tienda
        </a>
    </div>
    <span class="fw-bold fs-5 d-flex align-items-center gap-2" style="color:#D4AF37; letter-spacing:1px;">
        <img th:src="@{/marca/logo.png}" alt="Olimpic" style="height:32px; width:32px; object-fit:contain;">
        OLIMPIC
    </span>
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-sm fw-semibold" style="background:#F2E9D8; color:#241E14;">Cerrar sesión</button>
    </form>
</header>

<!-- Bootstrap JS (offcanvas) — necesario para el menú lateral -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</th:block>

</body>
</html>
