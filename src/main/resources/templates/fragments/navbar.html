<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navbar">

<header class="d-flex align-items-center justify-content-between px-3 px-md-4 py-2 header-ol">
    <nav class="navbar-filtros d-flex align-items-center gap-2 flex-grow-1 overflow-auto">
        <i class="bi bi-funnel-fill text-ol-gold me-1" title="Filtrar por categoría"></i>
        <a th:href="@{/}" class="btn btn-sm rounded-pill fw-semibold flex-shrink-0"
           th:classappend="${categoriaSeleccionada == null} ? 'pill-ol-active' : 'pill-ol-inactive'">
            Todos
        </a>
        <a th:each="cat : ${categorias}"
           th:href="@{/(categoria=${cat.id})}"
           th:text="${cat.nombre}"
           class="btn btn-sm rounded-pill fw-semibold flex-shrink-0"
           th:classappend="${categoriaSeleccionada != null and categoriaSeleccionada == cat.id} ? 'pill-ol-active' : 'pill-ol-inactive'">
        </a>
    </nav>

    <div class="d-flex align-items-center gap-2 flex-shrink-0 ms-2">
        <button type="button" id="temaBtn" onclick="toggleTema()"
                class="btn btn-sm fw-semibold"
                style="background:var(--ol-gray); color:var(--ol-text); border:1px solid var(--ol-border);">
            <i id="temaIcono" class="bi bi-moon-stars"></i>
        </button>

        <a href="#carrito"
           class="btn btn-sm fw-semibold position-relative"
           style="background:var(--ol-gray); color:var(--ol-text); border:1px solid var(--ol-border);">
            <i class="bi bi-cart3 fs-5"></i>
            <span th:if="${carritoContador != null and carritoContador > 0}"
                  id="carritoBadge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill"
                  style="background:var(--ol-gold); color:var(--ol-black); font-size:.6rem;"
                  th:text="${carritoContador}"></span>
        </a>

        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-sm fw-semibold btn-ol-outline">
            <i class="bi bi-person me-1"></i>Iniciar sesión
        </a>

        <div sec:authorize="isAuthenticated()" class="dropdown">
            <a class="btn btn-sm d-flex align-items-center gap-2 text-decoration-none dropdown-toggle"
               href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
               style="background:var(--ol-gray); color:var(--ol-text); border:1px solid var(--ol-border); border-radius:50px; padding:4px 12px 4px 4px;">
                <img th:if="${usuarioActual != null and usuarioActual.fotoPerfil != null}"
                     th:src="@{'/imagenes/perfiles/' + ${usuarioActual.fotoPerfil}}"
                     class="avatar-ol" style="width:30px; height:30px;" alt="">
                <span th:unless="${usuarioActual != null and usuarioActual.fotoPerfil != null}"
                      class="avatar-ol-placeholder" style="width:30px; height:30px; font-size:.7rem;"
                      th:text="${usuarioActual != null} ? ${#strings.substring(usuarioActual.nombre, 0, 1)} : 'U'"></span>
                <span class="d-none d-md-inline small fw-semibold text-truncate" style="max-width:100px;"
                      sec:authentication="name"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-ol mt-2">
                <li>
                    <div class="px-3 py-2 border-bottom" style="border-color:var(--ol-border)!important;">
                        <p class="small fw-bold mb-0" style="color:var(--ol-white);" sec:authentication="name"></p>
                        <p class="small mb-0" style="color:var(--ol-text-muted);" sec:authentication="name"></p>
                    </div>
                </li>
                <li><a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-house-door me-2"></i>Mi panel</a></li>
                <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#modalFotoPerfil"><i class="bi bi-camera me-2"></i>Cambiar foto</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item" style="color:var(--ol-danger);">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

<div th:replace="~{fragments/carrito-sidebar :: carritoSidebar}"></div>

<!-- Modal foto de perfil (compartido) -->
<div class="modal fade" id="modalFotoPerfil" tabindex="-1" aria-labelledby="modalFotoPerfilLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background:var(--ol-card); border:1px solid var(--ol-border); border-radius:18px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="modalFotoPerfilLabel" style="color:var(--ol-white);">
                    <i class="bi bi-camera me-2" style="color:var(--ol-gold);"></i>Foto de perfil
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <img th:if="${usuarioActual != null and usuarioActual.fotoPerfil != null}"
                         th:src="@{'/imagenes/perfiles/' + ${usuarioActual.fotoPerfil}}"
                         class="avatar-ol-lg mb-2" alt="Foto actual">
                    <div th:unless="${usuarioActual != null and usuarioActual.fotoPerfil != null}"
                         class="avatar-ol-placeholder-lg mx-auto mb-2"
                         th:text="${usuarioActual != null} ? ${#strings.substring(usuarioActual.nombre, 0, 1)} : 'U'"></div>
                    <p class="small text-ol-muted mb-0">Foto actual</p>
                </div>
                <form th:action="@{/perfil/foto}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="archivoFoto" class="foto-upload-zone d-block">
                            <i class="bi bi-cloud-arrow-up fs-2 d-block mb-2" style="color:var(--ol-gold);"></i>
                            <span class="fw-semibold" style="color:var(--ol-text);">Toca para seleccionar una imagen</span>
                            <div class="small text-ol-muted mt-1">JPG, PNG o WEBP · Max 5MB</div>
                        </label>
                        <input type="file" id="archivoFoto" name="archivoFoto" accept=".jpg,.jpeg,.png,.webp" class="d-none"
                               onchange="if(this.files&&this.files[0]){var r=new FileReader();r.onload=function(e){document.getElementById('previewFoto').src=e.target.result;document.getElementById('previewFoto').classList.remove('d-none');document.getElementById('uploadPlaceholder').classList.add('d-none');};r.readAsDataURL(this.files[0]);}">
                    </div>
                    <div class="text-center mb-3">
                        <img id="previewFoto" class="avatar-ol-lg d-none" alt="Preview">
                        <div id="uploadPlaceholder"></div>
                    </div>
                    <button type="submit" class="btn w-100 fw-bold py-2 rounded-pill btn-ol-gold">
                        <i class="bi bi-check-lg me-1"></i>GUARDAR FOTO
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</div>
</body>
</html>
