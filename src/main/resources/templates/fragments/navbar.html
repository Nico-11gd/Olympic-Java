<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navbar">

<style>
    .carrito-overlay {
        position: fixed; inset: 0; z-index: 1050;
        background: rgba(36,30,20,.45);
        opacity: 0; pointer-events: none;
        transition: opacity .3s ease;
    }
    .carrito-overlay:target { opacity: 1; pointer-events: auto; }

    .carrito-panel {
        position: fixed; top: 0; right: 0; z-index: 1060;
        width: 100%; max-width: 420px; height: 100vh;
        background: #FFFDF6;
        box-shadow: -4px 0 24px rgba(36,30,20,.18);
        transform: translateX(100%);
        transition: transform .3s ease;
        display: flex; flex-direction: column;
    }
    .carrito-overlay:target .carrito-panel { transform: translateX(0); }

    .carrito-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 20px 24px 16px;
        border-bottom: 1px solid #E6D9B8;
    }
    .carrito-header h5 { margin: 0; font-weight: 700; color: #241E14; }
    .carrito-close {
        display: inline-flex; align-items: center; justify-content: center;
        width: 36px; height: 36px; border-radius: 50%;
        background: #F2E9D8; color: #241E14;
        text-decoration: none; font-size: 1.3rem; line-height: 1;
        transition: background .2s;
    }
    .carrito-close:hover { background: #E6D9B8; }

    .carrito-body {
        flex: 1; overflow-y: auto; padding: 0 24px;
    }

    .carrito-item {
        display: flex; gap: 14px; padding: 16px 0;
        border-bottom: 1px solid #f0ebe0;
    }
    .carrito-item-img {
        width: 72px; height: 72px; flex-shrink: 0;
        border-radius: 10px; overflow: hidden; background: #FFF4D9;
    }
    .carrito-item-img img { width: 100%; height: 100%; object-fit: cover; }

    .carrito-footer {
        padding: 20px 24px;
        border-top: 1px solid #E6D9B8;
        background: #FFFDF6;
    }
    .carrito-resumen-row {
        display: flex; justify-content: space-between; font-size: .85rem; margin-bottom: 6px;
    }
    .carrito-resumen-row span:first-child { color: #888; }
    .carrito-resumen-row span:last-child { font-weight: 600; color: #241E14; }
    .carrito-total {
        display: flex; justify-content: space-between;
        font-weight: 700; font-size: 1.05rem;
        padding-top: 10px; margin-top: 8px;
        border-top: 1px solid #E6D9B8; color: #241E14;
    }
    .carrito-total span:last-child { color: #D4AF37; }
    .carrito-descuento { color: #43A047; }

    .carrito-btn {
        display: block; width: 100%; padding: 12px;
        border: none; border-radius: 50px; font-weight: 700;
        font-size: .9rem; letter-spacing: 1px; text-align: center;
        text-decoration: none; cursor: pointer; margin-top: 12px;
    }
    .carrito-btn-primary { background: #D4AF37; color: #241E14; }
    .carrito-btn-secondary { background: #FFFDF6; color: #666; border: 1px solid #ddd; }
</style>

<header class="d-flex align-items-center justify-content-between px-4 py-2"
        style="background:#FFFDF6; border-bottom:1px solid #E6D9B8;">
    <a th:href="@{/}" class="text-decoration-none d-flex align-items-center gap-2">
        <img th:src="@{/marca/logo.png}" alt="Olimpic" style="height:42px; width:42px; object-fit:contain;">
        <span class="fw-bold fs-5" style="color:#241E14; letter-spacing:1px; font-family: Georgia, serif;">Olimpic</span>
    </a>

    <div class="d-flex align-items-center gap-2">
        <a href="#carrito"
           class="btn btn-sm fw-semibold position-relative"
           style="background:#F2E9D8; color:#241E14;">
            <i class="bi bi-cart3 fs-5"></i>
            <span th:if="${carritoContador != null and carritoContador > 0}"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size:.6rem;"
                  th:text="${carritoContador}"></span>
        </a>

        <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="btn btn-sm fw-semibold"
           style="background:#F2E9D8; color:#241E14;">Iniciar sesión</a>

        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="btn btn-sm fw-semibold"
           style="background:#D4AF37; color:#241E14;">
            <i class="bi bi-grid-3x3-gap-fill me-1"></i>Panel Admin
        </a>

        <span sec:authorize="isAuthenticated() and !hasRole('ADMIN')" class="small fw-semibold" style="color:#241E14;" sec:authentication="name"></span>

        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-sm fw-semibold" style="background:#F2E9D8; color:#241E14;">Cerrar sesión</button>
        </form>
    </div>
</header>

<div th:replace="~{fragments/carrito-sidebar :: carritoSidebar}"></div>

</div>
</body>
</html>
